name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  # The job id "test" is the status check name to require in branch protection.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm test
