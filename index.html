<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Expense Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header>
    <h1>Team Expense Tracker</h1>
  </header>

  <main>
    <!-- Task 1: Expense Form -->
    <section id="form-section">
      <form id="expense-form">
        <div>
          <label for="description">Description:</label>
          <input type="text" id="description" required placeholder="Enter description">
        </div>
        <div>
          <label for="amount">Amount:</label>
          <input type="number" id="amount" step="0.01" required placeholder="0.00">
        </div>
        <div>
          <label for="category">Category:</label>
          <select id="category">
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Supplies">Supplies</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <button type="submit">Add</button>
      </form>
    </section>

    <!-- Task 1: Expense List and Total -->
    <section id="list-section">
      <h2>Expenses</h2>
      <ul id="expense-list"></ul>
      <div id="expense-total">Total: $0.00</div>
    </section>
  </main>

  <script type="module" src="app.js"></script>
</body>

</html>
